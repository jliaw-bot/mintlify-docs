const QUESTIONS_PER_TIER = 25; // use the full 150-character bank (25 per tier × 6 tiers)
const ALL_CHARS = TIERS.flatMap((t) => t.chars);
const PASS_THRESHOLD = 70;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickDistractors(correctChar, tier, mode) {
  const textOf = (c) => (mode === "meaning" ? c.meaning : c.pinyin);
  const used = new Set([textOf(correctChar)]);
  const results = [];

  // Prefer distractors from the same tier for calibrated difficulty.
  for (const c of shuffle(tier.chars.filter((c) => c.char !== correctChar.char))) {
    const text = textOf(c);
    if (used.has(text)) continue;
    used.add(text);
    results.push(text);
    if (results.length === 3) return results;
  }

  // Fall back to the full bank if the tier doesn't have enough unique text
  // (guards against homophones/synonyms like 他/她 both being "tā").
  for (const c of shuffle(ALL_CHARS.filter((c) => c.char !== correctChar.char))) {
    const text = textOf(c);
    if (used.has(text)) continue;
    used.add(text);
    results.push(text);
    if (results.length === 3) return results;
  }
  return results;
}

function buildQuiz() {
  const questions = [];
  TIERS.forEach((tier) => {
    const picked = shuffle(tier.chars).slice(0, QUESTIONS_PER_TIER);
    picked.forEach((ch) => {
      const mode = Math.random() < 0.5 ? "meaning" : "pinyin";
      const correctText = mode === "meaning" ? ch.meaning : ch.pinyin;
      const distractors = pickDistractors(ch, tier, mode);
      const options = shuffle([correctText, ...distractors]);
      questions.push({
        id: `${tier.id}-${ch.char}`,
        tierId: tier.id,
        tierLabel: tier.label,
        hsk: tier.hsk,
        char: ch.char,
        pinyin: ch.pinyin,
        meaning: ch.meaning,
        mode,
        correctText,
        options,
      });
    });
  });
  return questions;
}

function ChineseLiteracyAssessment() {
  const [screen, setScreen] = useState("intro"); // intro | quiz | results
  const [studentName, setStudentName] = useState("");
  const [quiz, setQuiz] = useState([]);
  const [currentIndex, setCurrentIndex] = useState(0);
  const [answers, setAnswers] = useState([]);
  const [selected, setSelected] = useState(null);
  const [locked, setLocked] = useState(false);

  const currentQ = quiz[currentIndex];

  function startTest() {
    const q = buildQuiz();
    setQuiz(q);
    setCurrentIndex(0);
    setAnswers([]);
    setSelected(null);
    setLocked(false);
    setScreen("quiz");
  }

  function restart() {
    setScreen("intro");
    setQuiz([]);
    setCurrentIndex(0);
    setAnswers([]);
    setSelected(null);
    setLocked(false);
  }

  function handleSelect(optionText) {
    if (locked || !currentQ) return;
    const correct = optionText === currentQ.correctText;
    setSelected(optionText);
    setLocked(true);
    const record = { ...currentQ, chosenText: optionText, correct };
    setAnswers((prev) => [...prev, record]);
    setTimeout(() => {
      if (currentIndex + 1 < quiz.length) {
        setCurrentIndex((i) => i + 1);
        setSelected(null);
        setLocked(false);
      } else {
        setScreen("results");
      }
    }, 850);
  }

  const tierStats = useMemo(() => {
    return TIERS.map((tier) => {
      const tAns = answers.filter((a) => a.tierId === tier.id);
      const correct = tAns.filter((a) => a.correct).length;
      const total = tAns.length;
      const pct = total ? Math.round((correct / total) * 100) : 0;
      return { ...tier, correct, total, pct };
    });
  }, [answers]);

  const totalCorrect = answers.filter((a) => a.correct).length;
  const totalQ = answers.length;
  const overallPct = totalQ ? Math.round((totalCorrect / totalQ) * 100) : 0;

  const estimatedTier = useMemo(() => {
    let est = null;
    for (const t of tierStats) {
      if (t.total > 0 && t.pct >= PASS_THRESHOLD) est = t;
      else break;
    }
    return est;
  }, [tierStats]);

  const levelLabel = estimatedTier ? estimatedTier.hsk : "Pre-HSK 1";
  const levelSub = estimatedTier ? estimatedTier.tag : "Beginning";

  const missed = answers.filter((a) => !a.correct);

  return (
    <div
      style={{
        minHeight: "100%",
        background: PAPER,
        backgroundImage:
          "radial-gradient(circle at 1px 1px, rgba(33,31,26,0.05) 1px, transparent 0)",
        backgroundSize: "18px 18px",
        color: INK,
        fontFamily: "'Noto Serif', serif",
        padding: "28px 16px 60px",
        boxSizing: "border-box",
      }}
    >
      <style>{`
        ${FONT_IMPORT}
        .clc-btn {
          font-family: 'Noto Serif', serif;
          cursor: pointer;
          transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
        }
        .clc-btn:hover { transform: translateY(-1px); }
        .clc-btn:active { transform: translateY(0px); }
        .clc-btn:focus-visible {
          outline: 2.5px solid ${SEAL};
          outline-offset: 2px;
        }
        .clc-option:focus-visible {
          outline: 2.5px solid ${SEAL};
          outline-offset: 2px;
        }
        .clc-input:focus-visible, .clc-input:focus {
          outline: 2.5px solid ${SEAL};
          outline-offset: 1px;
        }
        @keyframes stampIn {
          0% { opacity: 0; transform: scale(1.6) rotate(-18deg); }
          60% { opacity: 1; transform: scale(0.92) rotate(-7deg); }
          100% { opacity: 1; transform: scale(1) rotate(-6deg); }
        }
        .clc-stamp { animation: stampIn 0.5s ease-out both; animation-delay: 0.15s; }
        @media (prefers-reduced-motion: reduce) {
          .clc-stamp { animation: none; }
          .clc-btn:hover { transform: none; }
        }
        @media (max-width: 480px) {
          .clc-options { grid-template-columns: 1fr !important; }
          .clc-tierbreak { grid-template-columns: 1fr !important; }
        }
      `}</style>

      <div style={{ maxWidth: 640, margin: "0 auto" }}>
        {screen === "intro" && (
          <IntroScreen
            studentName={studentName}
            setStudentName={setStudentName}
            onStart={startTest}
          />
        )}

        {screen === "quiz" && currentQ && (
          <QuizScreen
            quiz={quiz}
            currentIndex={currentIndex}
            currentQ={currentQ}
            answers={answers}
            selected={selected}
            locked={locked}
            onSelect={handleSelect}
          />
        )}

        {screen === "results" && (
          <ResultsScreen
            studentName={studentName}
            totalCorrect={totalCorrect}
            totalQ={totalQ}
            overallPct={overallPct}
            levelLabel={levelLabel}
            levelSub={levelSub}
            tierStats={tierStats}
            missed={missed}
            onRestart={restart}
          />
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------
   INTRO
------------------------------------------------------------------ */
function IntroScreen({ studentName, setStudentName, onStart }) {
  return (
    <div>
      <div style={{ textAlign: "center", marginBottom: 34 }}>
        <div
          style={{
            fontFamily: "'JetBrains Mono', monospace",
            fontSize: 12,
            letterSpacing: "0.16em",
            color: INK_SOFT,
            textTransform: "uppercase",
            marginBottom: 10,
          }}
        >
          Character Literacy Diagnostic
        </div>
        <h1
          style={{
            fontFamily: "'Noto Serif SC', serif",
            fontSize: 52,
            fontWeight: 700,
            margin: "0 0 6px",
            letterSpacing: "0.06em",
          }}
        >
          汉字水平测试
        </h1>
        <div
          style={{
            fontFamily: "'Noto Serif', serif",
            fontStyle: "italic",
            color: INK_SOFT,
            fontSize: 15,
          }}
        >
          Hànzì Shuǐpíng Cèshì — a reading-level check-up, one character at a time
        </div>
      </div>

      <div
        style={{
          background: PAPER_DARK,
          border: `1.5px solid ${PAPER_LINE}`,
          padding: "22px 22px",
          marginBottom: 24,
        }}
      >
        <p style={{ margin: "0 0 12px", lineHeight: 1.6, fontSize: 15 }}>
          This diagnostic samples <strong>36 characters</strong> across six
          proficiency tiers, from foundational (HSK 1) to literary (HSK 6).
          For each character you'll be asked either its{" "}
          <strong>meaning</strong> or its <strong>pinyin</strong> — the test
          climbs in difficulty, tier by tier, to find the edge of what a
          student can reliably read.
        </p>
        <p style={{ margin: 0, lineHeight: 1.6, fontSize: 15, color: INK_SOFT }}>
          Takes about 8–10 minutes. At the end you'll get an estimated
          reading level plus a tier-by-tier breakdown and a review list of
          any characters missed.
        </p>
      </div>

      <label
        style={{
          display: "block",
          fontFamily: "'JetBrains Mono', monospace",
          fontSize: 12,
          letterSpacing: "0.08em",
          color: INK_SOFT,
          textTransform: "uppercase",
          marginBottom: 8,
        }}
      >
        Student name <span style={{ opacity: 0.6 }}>(optional)</span>
      </label>
      <input
        className="clc-input"
        value={studentName}
        onChange={(e) => setStudentName(e.target.value)}
        placeholder="e.g. Jordan Lee"
        style={{
          width: "100%",
          boxSizing: "border-box",
          padding: "12px 14px",
          fontSize: 15,
          fontFamily: "'Noto Serif', serif",
          border: `1.5px solid ${INK}`,
          background: PAPER,
          color: INK,
          marginBottom: 26,
        }}
      />

      <button
        className="clc-btn"

        style={{
          display: "block",
          width: "100%",
          padding: "16px 20px",
          fontSize: 17,
          fontWeight: 700,
          color: PAPER,
          background: SEAL,
          border: "none",
          boxShadow: "3px 3px 0 rgba(33,31,26,0.25)",
        }}
      >
        开始测试 &nbsp;·&nbsp; Start Test
      </button>
    </div>
  );
}

/* ---------------------------------------------------------------
   QUIZ
------------------------------------------------------------------ */
function QuizScreen({ quiz, currentIndex, currentQ, answers, selected, locked, onSelect }) {
  const promptText =
    currentQ.mode === "meaning"
      ? "What does this character mean?"
      : "What is the pinyin (with tone) for this character?";

  return (
    <div>
      {/* progress track */}
      <div
        style={{
          display: "flex",
          flexWrap: "wrap",
          gap: 4,
          marginBottom: 22,
          justifyContent: "center",
        }}
      >
        {quiz.map((q, i) => {
          const done = answers[i];
          let bg = "transparent";
          let border = PAPER_LINE;
          if (done) {
            bg = done.correct ? JADE_SOFT : SEAL_SOFT;
            border = done.correct ? JADE : SEAL;
          } else if (i === currentIndex) {
            border = INK;
          }
          return (
            <div
              key={q.id}
              title={`Q${i + 1} · ${q.tierLabel}`}
              style={{
                width: 16,
                height: 16,
                background: bg,
                border: `1.5px solid ${border}`,
                boxSizing: "border-box",
              }}
            />
          );
        })}
      </div>

      <div
        style={{
          display: "flex",
          justifyContent: "space-between",
          alignItems: "center",
          marginBottom: 18,
          fontFamily: "'JetBrains Mono', monospace",
          fontSize: 12,
          letterSpacing: "0.06em",
          color: INK_SOFT,
        }}
      >
        <span>
          QUESTION {String(currentIndex + 1).padStart(2, "0")} / {quiz.length}
        </span>
        <span
          style={{
            padding: "3px 9px",
            border: `1px solid ${OCHRE}`,
            color: OCHRE,
            textTransform: "uppercase",
          }}
        >
          {currentQ.hsk} · {currentQ.tag}
        </span>
      </div>

      <div style={{ textAlign: "center", marginBottom: 22 }}>
        <CharacterGrid char={currentQ.char} />
      </div>

      <p
        style={{
          textAlign: "center",
          fontSize: 17,
          fontWeight: 600,
          marginBottom: 20,
        }}
      >
        {promptText}
      </p>

      <div
        className="clc-options"
        style={{
          display: "grid",
          gridTemplateColumns: "1fr 1fr",
          gap: 12,
        }}
      >
        {currentQ.options.map((opt, i) => {
          const letter = String.fromCharCode(65 + i);
          const isSelected = selected === opt;
          const isCorrectOpt = opt === currentQ.correctText;
          let borderColor = INK;
          let bg = PAPER;
          if (locked && isSelected) {
            borderColor = isCorrectOpt ? JADE : SEAL;
            bg = isCorrectOpt ? JADE_SOFT : SEAL_SOFT;
          } else if (locked && isCorrectOpt) {
            borderColor = JADE;
          }
          return (
            <button
              key={opt}
              className="clc-btn clc-option"
              disabled={locked}
              onClick={() => onSelect(opt)}
              style={{
                display: "flex",
                alignItems: "center",
                gap: 10,
                textAlign: "left",
                padding: "13px 14px",
                fontSize: 15,
                border: `1.75px solid ${borderColor}`,
                background: bg,
                color: INK,
                cursor: locked ? "default" : "pointer",
              }}
            >
              <span
                style={{
                  fontFamily: "'JetBrains Mono', monospace",
                  fontWeight: 700,
                  width: 20,
                  height: 20,
                  borderRadius: "50%",
                  border: `1.5px solid ${INK}`,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  fontSize: 11,
                  flexShrink: 0,
                }}
              >
                {letter}
              </span>
              <span style={{ flex: 1 }}>{opt}</span>
              {locked && isSelected && (isCorrectOpt ? <CheckMark size={20} /> : <CrossMark size={20} />)}
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------
   RESULTS
------------------------------------------------------------------ */
function ResultsScreen({
  studentName,
  totalCorrect,
  totalQ,
  overallPct,
  levelLabel,
  levelSub,
  tierStats,
  missed,
  onRestart,
}) {
  return (
    <div>
      <div
        style={{
          position: "relative",
          background: PAPER_DARK,
          border: `1.5px solid ${INK}`,
          padding: "30px 24px 26px",
          marginBottom: 26,
          overflow: "visible",
        }}
      >
        {/* red circled score, teacher-grading style */}
        <div
          style={{
            position: "absolute",
            top: -18,
            right: -10,
            width: 74,
            height: 74,
            borderRadius: "50%",
            border: `3px solid ${SEAL}`,
            transform: "rotate(-9deg)",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            background: PAPER,
          }}
        >
          <div style={{ textAlign: "center", lineHeight: 1.05 }}>
            <div
              style={{
                fontFamily: "'JetBrains Mono', monospace",
                fontWeight: 700,
                fontSize: 18,
                color: SEAL,
              }}
            >
              {totalCorrect}/{totalQ}
            </div>
          </div>
        </div>

        <div
          style={{
            fontFamily: "'JetBrains Mono', monospace",
            fontSize: 12,
            letterSpacing: "0.14em",
            textTransform: "uppercase",
            color: INK_SOFT,
            marginBottom: 8,
          }}
        >
          {studentName ? `${studentName}'s Results` : "Results"}
        </div>
        <h2
          style={{
            margin: "0 0 4px",
            fontSize: 26,
            fontFamily: "'Noto Serif', serif",
          }}
        >
          {overallPct}% overall accuracy
        </h2>
        <p style={{ margin: 0, color: INK_SOFT, fontSize: 14 }}>
          {totalCorrect} of {totalQ} characters answered correctly across six
          tiers.
        </p>

        {/* seal stamp with estimated level */}
        <div
          className="clc-stamp"
          style={{
            marginTop: 22,
            display: "inline-flex",
            flexDirection: "column",
            alignItems: "center",
            justifyContent: "center",
            width: 132,
            height: 132,
            border: `3px solid ${SEAL}`,
            color: SEAL,
            transform: "rotate(-6deg)",
            padding: 10,
            boxSizing: "border-box",
          }}
        >
          <div
            style={{
              fontFamily: "'Noto Serif SC', serif",
              fontSize: 13,
              letterSpacing: "0.08em",
              marginBottom: 4,
            }}
          >
            估计水平
          </div>
          <div
            style={{
              fontFamily: "'JetBrains Mono', monospace",
              fontWeight: 700,
              fontSize: 20,
              lineHeight: 1.1,
              textAlign: "center",
            }}
          >
            {levelLabel}
          </div>
          <div
            style={{
              fontSize: 10.5,
              textTransform: "uppercase",
              letterSpacing: "0.06em",
              marginTop: 4,
              textAlign: "center",
            }}
          >
            {levelSub}
          </div>
        </div>
        <p style={{ marginTop: 14, fontSize: 13, color: INK_SOFT, maxWidth: 420, lineHeight: 1.5 }}>
          Estimated level is the highest tier where accuracy stayed at or
          above {PASS_THRESHOLD}%. Review the tier breakdown below for the
          full picture — a student can be solid in one tier and shaky in
          another.
        </p>
      </div>

      {/* tier breakdown */}
      <h3
        style={{
          fontFamily: "'JetBrains Mono', monospace",
          fontSize: 13,
          letterSpacing: "0.1em",
          textTransform: "uppercase",
          color: INK_SOFT,
          marginBottom: 12,
        }}
      >
        Tier Breakdown
      </h3>
      <div style={{ marginBottom: 30 }}>
        {tierStats.map((t) => (
          <div key={t.id} style={{ marginBottom: 12 }}>
            <div
              style={{
                display: "flex",
                justifyContent: "space-between",
                fontSize: 13,
                marginBottom: 4,
              }}
            >
              <span>
                <strong>{t.hsk}</strong>{" "}
                <span style={{ color: INK_SOFT }}>· {t.tag}</span>
              </span>
              <span style={{ fontFamily: "'JetBrains Mono', monospace", color: INK_SOFT }}>
                {t.correct}/{t.total}
              </span>
            </div>
            <div
              style={{
                height: 10,
                background: PAPER_DARK,
                border: `1px solid ${PAPER_LINE}`,
              }}
            >
              <div
                style={{
                  height: "100%",
                  width: `${t.pct}%`,
                  background: t.pct >= PASS_THRESHOLD ? JADE : SEAL,
                  transition: "width 0.4s ease",
                }}
              />
            </div>
          </div>
        ))}
      </div>

      {/* missed characters */}
      {missed.length > 0 && (
        <>
          <h3
            style={{
              fontFamily: "'JetBrains Mono', monospace",
              fontSize: 13,
              letterSpacing: "0.1em",
              textTransform: "uppercase",
              color: INK_SOFT,
              marginBottom: 12,
            }}
          >
            Characters to Review ({missed.length})
          </h3>
          <div
            className="clc-tierbreak"
            style={{
              display: "grid",
              gridTemplateColumns: "1fr 1fr",
              gap: 10,
              marginBottom: 30,
            }}
          >
            {missed.map((m) => (
              <div
                key={m.id}
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 10,
                  border: `1.5px solid ${SEAL}`,
                  background: "rgba(165,50,31,0.06)",
                  padding: "9px 10px",
                }}
              >
                <div
                  style={{
                    fontFamily: "'Noto Serif SC', serif",
                    fontSize: 26,
                    width: 40,
                    height: 40,
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                    border: `1.5px solid ${INK}`,
                    background: PAPER,
                    flexShrink: 0,
                  }}
                >
                  {m.char}
                </div>
                <div style={{ fontSize: 12.5, lineHeight: 1.35 }}>
                  <div style={{ fontFamily: "'JetBrains Mono', monospace" }}>{m.pinyin}</div>
                  <div style={{ color: INK_SOFT }}>{m.meaning}</div>
                  <div style={{ color: OCHRE, fontSize: 11 }}>{m.hsk}</div>
                </div>
              </div>
            ))}
          </div>
        </>
      )}

      {missed.length === 0 && (
        <div
          style={{
            border: `1.5px solid ${JADE}`,
            background: JADE_SOFT,
            padding: "16px 16px",
            marginBottom: 30,
            fontSize: 14,
          }}
        >
          Perfect run — every character was answered correctly. Consider a
          harder follow-up assessment to find the true ceiling.
        </div>
      )}

      <button
        className="clc-btn"
        onClick={onRestart}
        style={{
          display: "block",
          width: "100%",
          padding: "15px 20px",
          fontSize: 15,
          fontWeight: 700,
          color: INK,
          background: PAPER,
          border: `2px solid ${INK}`,
        }}
      >
        重新测试 &nbsp;·&nbsp; Retake Test
      </button>
    </div>
  );
}

root.render(<ChineseLiteracyAssessment />);
</script>
